<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Enviar el origen (https) como Referer: esto evita el Error 153 de YouTube. -->
  <meta name="referrer" content="origin">
  <title>Reproductor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* pointer-events:none -> el iframe NO recibe ningún clic ni hover del mando:
       así la UI de YouTube (logo, "Más vídeos", "Ver en YouTube") NO aparece y
       es imposible de pulsar. El vídeo se ve y se oye con normalidad. */
    #yt { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!--
    Página-reproductor para la app Kids YouTube (webOS). Genérica y sin secretos.
    Embed PLANO de YouTube servido por https (evita el Error 153). Autoplay con
    sonido. El iframe va en pointer-events:none para que el niño no pueda tocar ni
    ver la UI de YouTube (no hay forma de salir a YouTube). Avisa al padre con
    {type:'ended'} al terminar o justo antes del final (endCut) para pasar de vídeo.
  -->
  <script>
  (function () {
    "use strict";
    var ORIGIN = location.origin;
    var frame = null, endCut = 4, curId = null, hs = null, kicked = false;

    function post(m) { try { parent.postMessage(JSON.stringify(m), '*'); } catch (e) {} }
    function cmd(func, args) {
      if (frame && frame.contentWindow) {
        try { frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [] }), '*'); } catch (e) {}
      }
    }
    function embedUrl(id) {
      return 'https://www.youtube.com/embed/' + encodeURIComponent(id) +
        '?autoplay=1&mute=0&controls=0&rel=0&modestbranding=1&iv_load_policy=3' +
        '&fs=0&disablekb=1&playsinline=1&enablejsapi=1' +
        '&origin=' + encodeURIComponent(ORIGIN) + '&widget_referrer=' + encodeURIComponent(ORIGIN);
    }
    function clearHs() { if (hs) { clearInterval(hs); hs = null; } }

    function load(id) {
      curId = id; kicked = false; clearHs();
      if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
      frame = document.createElement('iframe');
      frame.id = 'yt';
      frame.allow = 'autoplay; fullscreen';
      frame.setAttribute('referrerpolicy', 'origin');
      frame.src = embedUrl(id);
      document.body.appendChild(frame);
      frame.addEventListener('load', function () {
        clearHs();
        hs = setInterval(function () {
          try { frame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (e) {}
        }, 250);
      });
    }
    function stop() {
      clearHs();
      if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
      frame = null; curId = null;
    }

    // Mensajes de la app (padre).
    window.addEventListener('message', function (ev) {
      var m; try { m = (typeof ev.data === 'string') ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
      if (!m || !m.type) return;
      if (m.type === 'load') { if (typeof m.endCut === 'number') endCut = m.endCut; load(m.videoId); }
      else if (m.type === 'stop') { stop(); }
    });

    // Mensajes del embed de YouTube (enablejsapi): asegurar play y detectar fin.
    window.addEventListener('message', function (ev) {
      if (String(ev.origin).indexOf('youtube') === -1) return;
      var d; try { d = (typeof ev.data === 'string') ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
      if (!d || !d.event) return;

      if (d.event === 'onReady' || d.event === 'initialDelivery' || d.event === 'infoDelivery') {
        clearHs();
        if (!kicked) { kicked = true; cmd('setVolume', [100]); cmd('playVideo'); }
      }
      if (d.event === 'infoDelivery' && d.info) {
        var i = d.info;
        if (i.playerState === 0) post({ type: 'ended', videoId: curId });
        else if (typeof i.currentTime === 'number' && typeof i.duration === 'number' &&
                 i.duration > 0 && i.currentTime >= i.duration - endCut) {
          post({ type: 'ended', videoId: curId });
        }
      }
      if (d.event === 'onStateChange' && d.info === 0) post({ type: 'ended', videoId: curId });
    });

    post({ type: 'ready' });
  })();
  </script>
</body>
</html>
